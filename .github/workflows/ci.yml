name: CI

# Builds and tests the real Cadence package (CLI + MCP server) on a clean
# GitHub-hosted runner from a fresh checkout: install, then run the test
# suite, which drives the actual CLI subprocess and the actual MCP tool
# functions -- not a mock of either surface.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-test:
    name: Install + test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Cadence (editable) + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run test suite
        run: pytest -q

      - name: CLI smoke check (fresh install, real subprocess, scratch store)
        run: |
          export CADENCE_DB_PATH="$RUNNER_TEMP/cadence-ci.db"
          cadence add "CI smoke task" --priority high
          cadence list
          cadence done 1
          cadence list
          set +e
          cadence done 999
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected exit code 1 for a malformed/unknown id, got $code"
            exit 1
          fi

      - name: MCP server starts cleanly over stdio
        run: |
          export CADENCE_DB_PATH="$RUNNER_TEMP/cadence-ci-mcp.db"
          timeout 5 cadence mcp < /dev/null
