name: Publish

# Builds sdist + wheel and publishes them to PyPI when a version tag
# (vX.Y.Z) is pushed. This is a single-button release: tag the commit,
# push the tag, this workflow does the rest.
#
# Publishes with the classic PYPI_API_TOKEN repo secret. (An earlier
# version of this workflow tried to branch between that and Trusted
# Publishing/OIDC using `if: secrets.PYPI_API_TOKEN != ''` on each step --
# GitHub's workflow parser rejects the `secrets` context inside an `if:`
# conditional for any job that also declares `environment:`, which made
# every run of this workflow fail at parse time with zero jobs queued,
# on every push, silently. Keeping it to one unconditional path avoids
# that trap. Switch to Trusted Publishing by removing the `password:`
# line below once a "pypi" publisher is configured on the PyPI project.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Validate distributions (twine check)
        run: python -m twine check dist/*

      - name: Upload built distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
