name: Publish

# Builds sdist + wheel and publishes them to PyPI. Two ways to trigger a
# release:
#   1. Push a version tag (vX.Y.Z) -- the classic, explicit path.
#   2. Push a commit to main that bumps [project].version in pyproject.toml
#      -- the repeatable path. The check-version job compares the version
#      in pyproject.toml against what's already on PyPI; if it's new, the
#      workflow builds, publishes, and tags the commit `vX.Y.Z` so there is
#      still a git record of the release. If the version on main is already
#      published, the workflow no-ops instead of failing (PyPI rejects
#      re-uploading an existing version number) -- so a normal, non-release
#      push to main is a harmless skip, not a broken run.
#
# This exists because "fixed on main" and "fixed for a stranger installing
# the package" used to be two different things: earlier fixes landed on
# main but the wheel on PyPI kept lagging, silently, because nothing ever
# re-triggered a publish. Bump the version in pyproject.toml as part of any
# fix that should ship, and this workflow does the rest.
#
# Publishes with the classic PYPI_API_TOKEN repo secret. (An earlier
# version of this workflow tried to branch between that and Trusted
# Publishing/OIDC using `if: secrets.PYPI_API_TOKEN != ''` on each step --
# GitHub's workflow parser rejects the `secrets` context inside an `if:`
# conditional for any job that also declares `environment:`, which made
# every run of this workflow fail at parse time with zero jobs queued,
# on every push, silently. Keeping it to one unconditional path avoids
# that trap. Switch to Trusted Publishing by removing the `password:`
# line below once a "pypi" publisher is configured on the PyPI project.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check-version:
    name: Check pyproject.toml version against PyPI
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      should_publish: ${{ steps.check.outputs.should_publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Determine version and publish status
        id: check
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/cadence-todo/$VERSION/json")
          if [ "$STATUS" = "200" ]; then
            echo "cadence-todo $VERSION is already on PyPI -- skipping build/publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "cadence-todo $VERSION is not on PyPI yet -- will build and publish."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build sdist + wheel
    needs: check-version
    if: needs.check-version.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Validate distributions (twine check)
        run: python -m twine check dist/*

      - name: Upload built distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [check-version, build]
    if: needs.check-version.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  tag-release:
    name: Tag the release commit (main-push releases only)
    needs: [check-version, publish]
    if: needs.check-version.outputs.should_publish == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tag the release
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          git config user.name "cadence-release-bot"
          git config user.email "actions@github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"
