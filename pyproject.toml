[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cadence-todo"
version = "0.1.1"
description = "Agentic-first todo app: local CLI + embedded SQLite store + MCP server for agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Cadence project" }]
dependencies = [
    # Pinned below mcp 2.x: v2 renamed FastMCP -> MCPServer and changed the
    # tool-registration API. Revisit this pin as a deliberate migration, not
    # an incidental bump.
    "mcp>=1.2.0,<2.0.0",
]

[project.scripts]
cadence = "cadence.cli:main"

[project.urls]
Homepage = "https://github.com/dominicplouffe/Cadence"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
